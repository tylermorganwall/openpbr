name: Build R source package

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify source tarball
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Test safe publication behavior
        run: node --test .github/scripts/publish-source.test.cjs
      - name: Build the triggering commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-build" "$RUNNER_TEMP/source-output"
          cd "$RUNNER_TEMP/source-build"
          R CMD build "$GITHUB_WORKSPACE"
          python3 "$GITHUB_WORKSPACE/.github/scripts/build-source.py" \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/source-build" "$RUNNER_TEMP/source-output"
      - name: Save verified source package
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: r-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-output/*
          if-no-files-found: error
          retention-days: 30
      - name: Link the build artifact
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          printf '### Verified R source package\n\n[Download this build artifact](%s) (retained for 30 days).\n\nMain-branch builds also publish a durable download in the publication job.\n' \
            "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish latest successful main source
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: source-release-main
      cancel-in-progress: false
    steps:
      # This job never runs R, package hooks, or pull-request code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v4
        with:
          name: r-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: source-output
      - uses: actions/github-script@v7
        with:
          script: |
            const publishSource = require('./.github/scripts/publish-source.cjs');
            await publishSource({ github, context, core, directory: 'source-output' });
